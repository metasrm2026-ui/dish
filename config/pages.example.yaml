# Example of a page as `python -m bore.cli studio sync` writes it to private/pages.yaml (made-up
# data). Pages are never configured in this repository: they come only from the dashboard (the page
# record, its sources and its playbook), so this file is only the shape.
pages:
  - slug: demo-page
    name: Demo Page
    facebook_url: https://www.facebook.com/DemoPage
    timezone: America/New_York         # audience timezone for DNA hour/weekday stats
    workspace: demo-workspace          # the tester's workspace the page belongs to
    status: live                       # draft | going_live | live | paused | failed: only a live page runs
    posts_per_day: 10                  # the hourly posts a day at most (page record)
    premium_per_day: 6                 # premium cards a UTC day at most; then the safe card
    socialpilot_login_id: "9100001"    # set only by the onboarding routine
    x_handles: [demoreporter, demooutlet]
    websites: [https://news.example.org/demo]
    subreddits: [demo]
    web_searches: ["Demo League news today"]
    tier_one: [demoreporter]           # reporters only; never league/team/outlet feeds
    officials: [demooutlet]            # authoritative but never scooping
